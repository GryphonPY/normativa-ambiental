# Configuration for Netlify

[build]
  # This is the directory that contains the built site files.
  # We are publishing the 'seguridad' folder which contains the index.html
  publish = "seguridad/"

# Explicitly define the functions directory. This is a more robust
# way to ensure Netlify's build system detects the functions.
[functions]
  directory = "netlify/functions/"

# Redirect rule to make our function accessible at a clean URL.
# This rule proxies requests from /api/ask-ai to the actual function endpoint.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200 # 200 status means this is a rewrite (proxy)
